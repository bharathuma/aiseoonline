name: Format deterministic toolkit files (temporary)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/deterministic-seo-toolkit-completion'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.18.0'
          run_install: false
      - name: Install locked dependencies
        run: |
          uv sync --project apps/api --locked --group dev
          pnpm install --frozen-lockfile
      - name: Format code
        run: |
          uv run --project apps/api --locked ruff check --fix --exit-zero apps/api
          uv run --project apps/api --locked ruff format apps/api
          pnpm format:web
      - name: Push formatted source
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
        run: |
          git add apps/api apps/web
          if git diff --cached --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: apply project formatting to final SEO tools"
          AUTH="$(printf 'x-access-token:%s' "$GH_PUSH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/feat/deterministic-seo-toolkit-completion
