name: Format SEO rules

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/seo-rule-engine'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: Install locked formatting tools
        run: uv sync --project apps/api --locked --group dev
      - name: Format rule engine and its tests
        run: |
          uv run --project apps/api --locked ruff check --select I --fix apps/api/src/aiseoonline_api/seo_core apps/api/tests/test_seo_rules.py
          uv run --project apps/api --locked ruff format apps/api/src/aiseoonline_api/seo_core apps/api/tests/test_seo_rules.py
      - name: Commit formatting
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
        run: |
          git add apps/api/src/aiseoonline_api/seo_core apps/api/tests/test_seo_rules.py
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(seo): format rule engine and fixture tests"
          AUTH="$(printf 'x-access-token:%s' "$GH_PUSH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/feat/seo-rule-engine
