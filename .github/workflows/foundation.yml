name: Foundation checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API tests, lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Install locked Python dependencies
        run: uv sync --project apps/api --locked --group dev
      - name: Check Python style
        run: uv run --project apps/api --locked ruff check apps/api
      - name: Check Python formatting
        run: uv run --project apps/api --locked ruff format --check apps/api
      - name: Check Python types
        run: uv run --project apps/api --locked mypy apps/api/src
      - name: Test API with coverage
        run: uv run --project apps/api --locked pytest apps/api/tests -q --cov=aiseoonline_api --cov-report=term-missing --cov-report=xml:apps/api/coverage.xml
      - name: Upload API coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage.xml
          if-no-files-found: ignore

  web:
    name: Web build, lint and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.18.0'
          run_install: false
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint TypeScript
        run: pnpm lint:web
      - name: Check frontend formatting
        run: pnpm format:check:web
      - name: Run frontend unit tests
        run: pnpm test:web
      - name: Check Astro and TypeScript
        run: pnpm check:web
      - name: Build Astro website
        run: pnpm build:web
      - name: Install browser
        run: pnpm --filter @aiseoonline/web exec playwright install --with-deps chromium
      - name: Browser smoke tests
        run: pnpm e2e:web
      - name: Upload browser report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-browser-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/screenshots/
          if-no-files-found: ignore
