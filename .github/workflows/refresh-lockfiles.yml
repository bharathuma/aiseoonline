name: Refresh locked dependencies

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lock:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'chore/api-quality-gates'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.18.0'
          run_install: false
      - name: Resolve dependency locks
        run: |
          uv lock --project apps/api
          pnpm install --no-frozen-lockfile
      - name: Format code and verify
        run: |
          pnpm format:web
          pnpm format:web
          pnpm format:check:web
          uv run --project apps/api ruff format apps/api
      - name: Commit refreshed locks and formatting
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
        run: |
          git add apps/api/uv.lock pnpm-lock.yaml apps/api apps/web
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update locked frontend dependencies and formatting"
          AUTH="$(printf 'x-access-token:%s' "$GH_PUSH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/chore/api-quality-gates
